name: Unpack update

on:
  push:
    branches: [main]
    paths:
      - "thread-update.zip"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Unpack thread-update.zip and commit its files
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.git" repo
          cd repo
          if [ ! -f thread-update.zip ]; then echo "No thread-update.zip here: nothing to do."; exit 0; fi
          unzip -o -q thread-update.zip
          git rm -q thread-update.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Connect the pages to Hedera: contract, agent and demo data"
          git push || (git pull --rebase && git push)
